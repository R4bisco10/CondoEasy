<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="tela1.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Login</title>
</head>
<body>
    <div class="login">
        <div class="cabecalho">
            <img src="" alt="">
            <h2>Bem-vindo ao CondoEasy</h2>
            <p>Gestão inteligente para o seu condomínio</p>
        </div>
        <div class="cadastro">
            <label for="email">E-mail</label>
            <div>
                <img width="20" height="20" src="https://img.icons8.com/fluency-systems-regular/48/new-post.png" alt="new-post"/>
                <input type="email" placeholder="seu@email.com" id="email">
            </div>
            <label for="senha" class="senha">Senha</label>
            <div>
                <img width="20" height="18" src="https://img.icons8.com/pastel-glyph/128/lock--v5.png" alt="lock--v5"/>
                <input type="password" placeholder="senha" id="senha">
            </div>
            <a class="ems">Esqueci minha senha</a>
            <a class="btnLogar">
                <p>Entrar</p>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-in-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0z"/>
                    <path fill-rule="evenodd" d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
                </svg>
            </a>
        </div>
        <div class="divisao">
            <span></span>
            <p>ou</p>
            <span></span>
        </div>
        <a class="criarConta">
            <p>Criar conta</p>
        </a>
        <div class="informacoes">
            <div>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-c-circle" viewBox="0 0 16 16">
                    <path d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.146 4.992c-1.212 0-1.927.92-1.927 2.502v1.06c0 1.571.703 2.462 1.927 2.462.979 0 1.641-.586 1.729-1.418h1.295v.093c-.1 1.448-1.354 2.467-3.03 2.467-2.091 0-3.269-1.336-3.269-3.603V7.482c0-2.261 1.201-3.638 3.27-3.638 1.681 0 2.935 1.054 3.029 2.572v.088H9.875c-.088-.879-.768-1.512-1.729-1.512"/>
                </svg>
                <p>2024 CondoEasy. Todos os direitos reservados.</p>
            </div>
            <div>
                <a>Privacidade</a>
                <a>Suporte</a>
            </div>
        </div>
    </div>
</body>
</html>
